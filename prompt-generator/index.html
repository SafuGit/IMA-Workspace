<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outreach Prompt Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    
    <main class="container">
        <header>
            <h1>Fylint Outreach <span>Prompt Generator</span></h1>
            <p>Generate highly targeted outreach prompts for Brand or Influencer campaigns.</p>
        </header>

        <form id="generatorForm" class="glass-panel">
            <div class="form-group type-toggle">
                <label>Outreach Type</label>
                <div class="toggle-container">
                    <input type="radio" id="typeBrand" name="outreachType" value="brand" checked>
                    <label for="typeBrand" class="toggle-label">Brand Outreach</label>
                    
                    <input type="radio" id="typeInfluencer" name="outreachType" value="influencer">
                    <label for="typeInfluencer" class="toggle-label">Influencer Outreach</label>
                </div>
            </div>

            <div id="brandSection" class="section">
                <h3>Brand Details</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="brandName">1. Brand Name</label>
                        <input type="text" id="brandName" placeholder="e.g. Incogni">
                    </div>
                    <div class="form-group">
                        <label for="brandLink">2. Brand Link</label>
                        <input type="url" id="brandLink" placeholder="e.g. https://incogni.com/">
                    </div>
                </div>
                <div class="form-group">
                    <label for="brandVideos">3. Extra Brand YouTube Videos (Integrations)</label>
                    <input type="text" id="brandVideos" placeholder="e.g. https://www.youtube.com/watch?v=...">
                </div>
            </div>

            <div id="creatorSection" class="section">
                <h3>Creator Details</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="creatorName">4. Creator Name</label>
                        <input type="text" id="creatorName" placeholder="e.g. Tech Enthusiast">
                    </div>
                    <div class="form-group">
                        <label for="creatorLink">5. Creator Link</label>
                        <input type="url" id="creatorLink" placeholder="e.g. https://youtube.com/@TechEnthusiastOfficial">
                    </div>
                </div>
                <div class="form-group">
                    <label for="creatorVideos">6. Extra YouTube Videos for Personalization</label>
                    <input type="text" id="creatorVideos" placeholder="Optional YouTube URLs...">
                </div>
            </div>

            <button type="submit" class="generate-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H5"/><path d="M16 16h-2"/></svg>
                Generate Prompt
            </button>
        </form>

        <div id="resultContainer" class="glass-panel result-panel hidden">
            <div class="result-header">
                <h3>Generated Prompt</h3>
                <button id="copyBtn" class="copy-btn" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    Copy
                </button>
            </div>
            <textarea id="promptOutput" readonly></textarea>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
