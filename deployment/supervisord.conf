; Supervisor Configuration (Python package: pip install supervisor)
; Run: supervisord -c deployment/supervisord.conf
; Manage: supervisorctl -c deployment/supervisord.conf status

[unix_http_server]
file=/srv/ima/safwano/supervisor.sock
chmod=0700

[supervisord]
logfile=/srv/ima/safwano/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/srv/ima/safwano/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///srv/ima/safwano/supervisor.sock

; Next.js Production Server (Port 3000)
[program:aikido-web]
directory=/srv/ima/safwano/main-tool/website/aikido-ima
command=npm start -- -p 3000
autostart=true
autorestart=true
startretries=3
environment=NODE_ENV="production",PORT="3000"
stdout_logfile=/srv/ima/safwano/logs/web-out.log
stderr_logfile=/srv/ima/safwano/logs/web-err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB

; Python Email Generation API Server (Port 8000)
[program:fylint-api]
directory=/srv/ima/safwano
command=/srv/ima/safwano/.venv/bin/python main-tool/email_generation/api_server.py --port 8000 --host 127.0.0.1
autostart=true
autorestart=true
startretries=3
stdout_logfile=/srv/ima/safwano/logs/api-out.log
stderr_logfile=/srv/ima/safwano/logs/api-err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
